name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate registry + manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          reg = json.loads(pathlib.Path("registry.json").read_text())
          if reg.get("schemaVersion") != 2:
              raise SystemExit(f"schemaVersion want 2 got {reg.get('schemaVersion')}")
          seen = set()
          for entry in reg["plugins"]:
              pid = entry["id"]
              man = entry["manifest"]
              if pid in seen:
                  raise SystemExit(f"duplicate id {pid}")
              seen.add(pid)
              if man.startswith("http://") or man.startswith("https://"):
                  raise SystemExit(f"{pid}: curated manifest must be a relative path, got {man}")
              if ".." in man or man.startswith("/"):
                  raise SystemExit(f"{pid}: invalid manifest path {man}")
              path = pathlib.Path(man)
              if not path.is_file():
                  raise SystemExit(f"{pid}: missing {man}")
              meta = json.loads(path.read_text())
              if meta.get("id") != pid:
                  raise SystemExit(f"{pid}: manifest id mismatch {meta.get('id')}")
              if not meta.get("assets"):
                  raise SystemExit(f"{pid}: assets required")
              for a in meta["assets"]:
                  for k in ("goos", "goarch", "url", "sha256", "size"):
                      if k not in a or a[k] in ("", None):
                          raise SystemExit(f"{pid}: asset missing {k}")
                  if not str(a["url"]).startswith("https://"):
                      raise SystemExit(f"{pid}: asset url must be https")
                  if "/releases/latest/" in str(a["url"]):
                      raise SystemExit(f"{pid}: refuse floating /releases/latest/ asset url")
              print("ok", pid, meta["version"], len(meta["assets"]), "assets")
          print(f"validated {len(reg['plugins'])} curated plugins")
          PY

      - name: Build submodule plugins (linux/amd64)
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            [ -f "$dir/plugin.json" ] || continue
            echo "==> building $dir"
            (cd "$dir" && CGO_ENABLED=0 go build -o /tmp/replacearr-plugin-build .)
          done
